# Render 배포 설정
#
# python 런타임에서 docker 로 바꿨습니다. 까닭은 Dockerfile 첫머리에 적어
# 두었습니다 — Tesseract 와 한글 글꼴은 pip 로 못 깝니다. (2026-09-27)
#
# 키는 여기에 적지 않습니다. `sync: false` 는 "값은 Render 대시보드에서
# 넣는다"는 뜻입니다. 저장소에 키를 적으면 보는 사람이 모두 쓸 수 있습니다.

services:
  - type: web
    name: forwardus
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    rootDir: forwardus
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render 가 만들어 줍니다. 사람이 정하지 않습니다.
      - key: DATABASE_URL
        fromDatabase:
          name: forwardus-db
          property: connectionString

      # --- 마스터 계정 -------------------------------------------------------
      # 앱이 뜰 때 없으면 만듭니다. **기본 비밀번호 "1234" 를 그대로 두면 안 됩니다.**
      # 대시보드에서 반드시 바꿔 넣으세요.
      - key: MASTER_EMAIL
        sync: false
      - key: MASTER_PASSWORD
        sync: false

      # --- AI (서류 읽기 · HS 분류 · 수출 상담) --------------------------------
      # 비우면 AI 기능만 꺼지고 나머지는 그대로 돕니다.
      - key: HMM_API_KEY          # 해상 스케줄(없으면 모의 스케줄)
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_DOC_MODEL
        sync: false
      - key: AI_HS_MODEL
        sync: false

      # --- 관세청 UNI-PASS ---------------------------------------------------
      # 비워도 굳혀 둔 관세율표·표준품명으로 답합니다. (data/mock/*.json)
      - key: CUSTOMS_API_KEY
        sync: false
      - key: UNIPASS_KEY_CUSTOMS
        sync: false
      - key: DATA_PORTAL_KEY_CUSTOMS
        sync: false

      # --- 공공데이터포털 공통 키 ---------------------------------------------
      - key: DATA_GO_KR_SERVICE_KEY
        sync: false

      # --- 환율 · 스케줄 · 추적 ------------------------------------------------
      - key: EXCHANGE_API_KEY
        sync: false
      - key: SCHEDULE_API_KEY
        sync: false
      - key: TRACKING_API_KEY
        sync: false

      # --- 관세청 UNI-PASS 서비스별 인증키 ------------------------------------
      #
      # config.py 가 서비스마다 UNIPASS_KEY_<이름> 을 따로 읽습니다.
      # 32개를 모두 넣어야 그 조회가 삽니다. 비운 것은 그 조회만 꺼집니다.
      # (관세율·표준품명은 굳혀 둔 파일로 답하므로 키가 없어도 됩니다)
      - key: UNIPASS_KEY_AIRLINE_DETAIL
        sync: false
      - key: UNIPASS_KEY_AIRLINE_LIST
        sync: false
      - key: UNIPASS_KEY_ARRIVAL_REPORT_AIR
        sync: false
      - key: UNIPASS_KEY_ARRIVAL_REPORT_SEA
        sync: false
      - key: UNIPASS_KEY_CARGO_CLEARANCE_PROGRESS
        sync: false
      - key: UNIPASS_KEY_CONTAINER_DETAIL
        sync: false
      - key: UNIPASS_KEY_CUSTOMS_CLEARANCE_CODE
        sync: false
      - key: UNIPASS_KEY_CUSTOMS_EXCHANGE_RATE
        sync: false
      - key: UNIPASS_KEY_DECLARATION_ATTACHMENT_SUBMISSION
        sync: false
      - key: UNIPASS_KEY_DECLARATION_CORRECTION_STATUS
        sync: false
      - key: UNIPASS_KEY_DEPARTURE_PERMIT_AIR
        sync: false
      - key: UNIPASS_KEY_DEPARTURE_PERMIT_SEA
        sync: false
      - key: UNIPASS_KEY_ENTRY_DEPARTURE_REPORT
        sync: false
      - key: UNIPASS_KEY_EXPORT_DECLARATION_VERIFY
        sync: false
      - key: UNIPASS_KEY_EXPORT_PERFORMANCE_BY_DECLARATION
        sync: false
      - key: UNIPASS_KEY_EXPORT_PERFORMANCE_BY_VIN
        sync: false
      - key: UNIPASS_KEY_EXPORT_PERIOD_SHORTENING_ITEM
        sync: false
      - key: UNIPASS_KEY_FORWARDER_DETAIL
        sync: false
      - key: UNIPASS_KEY_FORWARDER_LIST
        sync: false
      - key: UNIPASS_KEY_HS_CODE_SEARCH
        sync: false
      - key: UNIPASS_KEY_HS_NAVIGATION
        sync: false
      - key: UNIPASS_KEY_INSPECTION_QUARANTINE
        sync: false
      - key: UNIPASS_KEY_REEXPORT_COMPLETION_REPORT
        sync: false
      - key: UNIPASS_KEY_REEXPORT_CONDITIONAL_IMPORT_DEADLINE
        sync: false
      - key: UNIPASS_KEY_REEXPORT_EXEMPTION_BALANCE
        sync: false
      - key: UNIPASS_KEY_REQUIREMENT_APPROVAL
        sync: false
      - key: UNIPASS_KEY_SHIPPING_COMPANY_DETAIL
        sync: false
      - key: UNIPASS_KEY_SHIPPING_COMPANY_LIST
        sync: false
      - key: UNIPASS_KEY_SIMPLE_REFUND_COMPANY
        sync: false
      - key: UNIPASS_KEY_SIMPLE_REFUND_RATE
        sync: false
      - key: UNIPASS_KEY_STATISTICS_CODE
        sync: false
      - key: UNIPASS_KEY_TARIFF_RATE
        sync: false

      # --- 켜고 끄는 기능 ------------------------------------------------------
      # 계약서 조항 점검. 1 이면 켭니다. (2026-10-02 다시 켬 · 09-27 에 껐던 것)
      #
      # 이 값은 render.yaml 이 정합니다(sync: false 가 아닙니다). 그런데 서비스를
      # 대시보드에서 손으로 만들었거나 전에 대시보드에서 값을 고쳤다면 그쪽 값이
      # 남아 있을 수 있습니다. 배포 뒤 화면에 단추가 안 보이면 Render 대시보드의
      # Environment 에서 이 값이 1 인지 확인하세요.
      - key: CONTRACT_CLAUSES_ON
        value: "1"

databases:
  - name: forwardus-db
    plan: free
