[pytest]
testpaths = tests
markers =
    slow: 오래 걸리는 무작위 스윕. 평소에는 -m "not slow"로 빼고 돌립니다.
    live: 실제 기관 서버를 부르는 테스트. 기관이 멈추면 같이 실패하므로
        `-m "not live"`로 빼고 돌릴 수 있습니다.

# ┌─ 아직 pytest가 돌리지 않는 것 (2026-09-23 기준) ─────────────────────────┐
# │ tests/*.test.cjs 는 화면 쪽(JS) 규칙을 보는 테스트인데, pytest도 CI도    │
# │ 부르지 않습니다. 각 파일 머리에 적힌 대로 사람이 따로 돌려야 합니다.    │
# │                                                                          │
# │     node --test tests/cargo_display.test.cjs                             │
# │     node --test tests/doc_parties.test.cjs                               │
# │     node --test tests/doc_preview_name.test.cjs                          │
# │     node --test tests/work_draft_alert.test.cjs                          │
# │                                                                          │
# │ (`node --test tests/` 로 한꺼번에 돌리면 .cjs가 아닌 파일까지 집어서     │
# │  실패합니다. 파일을 하나씩 지정해야 합니다.)                             │
# │                                                                          │
# │ 그래서 지금은 "녹색"이 화면 쪽 규칙까지 본 것은 아닙니다. 검증할 때 이  │
# │ 점을 알고 보세요. pytest에서 node를 불러 함께 돌리는 방법이 있는데,      │
# │ node가 없는 환경에서 skip 처리가 필요해 일단 보류했습니다.               │
# └──────────────────────────────────────────────────────────────────────────┘
