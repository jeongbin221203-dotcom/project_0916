{# 검색·상태 거르기. 마스터는 작성자(이메일)로도 거릅니다. 결과는 보는 사람의 범위 안에서만 나옵니다. #}
<form class="dash_filters" method="get" action="{{ url_for('dashboard.index') }}" role="search">
  <input class="text_input" type="search" name="q" value="{{ filters.q }}" maxlength="100"
         placeholder="Shipment ID · 견적명 · Buyer · 항구 · B/L 번호" aria-label="검색어">
  {% if viewer.is_admin %}
    <input class="text_input" type="search" name="owner" value="{{ filters.owner }}" maxlength="100"
           placeholder="작성자 이메일" aria-label="작성자 이메일">
  {% endif %}
  <select class="text_input" name="status" aria-label="상태">
    <option value="">모든 상태</option>
    {% for key, label in statuses.items() %}
      <option value="{{ key }}" {{ 'selected' if filters.status == key }}>{{ label }}</option>
    {% endfor %}
  </select>
  <button class="button" type="submit">검색</button>
  {% if filters.q or filters.owner or filters.status %}
    <a class="button ghost" href="{{ url_for('dashboard.index') }}">초기화</a>
  {% endif %}
</form>
